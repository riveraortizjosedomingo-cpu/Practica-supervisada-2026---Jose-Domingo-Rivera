<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador Pokémon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>Explorador Pokémon</h1>

    <form id="formulario">
      <input
        id="busqueda"
        type="text"
        placeholder="Escribe un Pokémon"
      >

      <button id="boton" type="submit">
        Buscar
      </button>
    </form>

    <p id="estado">Escribe un Pokémon para comenzar.</p>

    <section id="resultado"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
